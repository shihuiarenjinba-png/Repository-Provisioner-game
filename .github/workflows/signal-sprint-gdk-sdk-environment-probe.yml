name: Signal Sprint GDK SDK environment probe

# Read-only hosted-runner capability check. No game build, CAS, or Store calls.
on:
  push:
    branches:
      - codex/game-gdk-sdk-environment-probe-20261029
      - codex/game-gdk-sdk-discovery-20261029
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-windows-gdk:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Detect makepkg.exe without executing it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # PATH is not the only supported location for a Microsoft GDK install.
          # Probe a bounded set of known roots; do not execute or install SDK.
          $pathMatches = @(Get-Command makepkg.exe -All -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandType -eq 'Application' })
          $candidatePaths = @()
          foreach ($candidateCommand in $pathMatches) { $candidatePaths += $candidateCommand.Source }
          foreach ($rootVar in @('GameDK', 'GameDKCoreLatest')) {
            $root = [Environment]::GetEnvironmentVariable($rootVar)
            if ($root) { $candidatePaths += (Join-Path $root 'bin\makepkg.exe') }
          }
          $binRoot = [Environment]::GetEnvironmentVariable('GDK_BIN')
          if ($binRoot) { $candidatePaths += (Join-Path $binRoot 'makepkg.exe') }
          $programFiles = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          if (-not $programFiles) { $programFiles = 'C:\Program Files (x86)' }
          $candidatePaths += (Join-Path $programFiles 'Microsoft GDK\bin\makepkg.exe')
          $seen = [System.Collections.Generic.HashSet[string]]::new(
            [System.StringComparer]::OrdinalIgnoreCase)
          $observed = @()
          foreach ($candidate in $candidatePaths) {
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) { continue }
            $resolved = [System.IO.Path]::GetFullPath($candidate)
            if (-not $seen.Add($resolved)) { continue }
            $item = Get-Item -LiteralPath $resolved -Force
            $linked = [bool]($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint)
            $digest = if ($linked) { $null } else {
              (Get-FileHash -LiteralPath $resolved -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            $observed += [ordered]@{
              path = $resolved
              linked_untrusted = $linked
              sha256_observed_unapproved = $digest
            }
          }
          $sha = if ($observed.Count -eq 1) { $observed[0].sha256_observed_unapproved } else { $null }
          $hints = @()
          foreach ($name in @('GameDK', 'GameDKCoreLatest', 'GDK_BIN', 'GXDKLatest', 'GamingSDK', 'GDK')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            $hints += [ordered]@{
              variable = $name
              set = [bool]$value
              path_exists = [bool]($value -and (Test-Path -LiteralPath $value))
            }
          }
          $status = if ($observed.Count -eq 0) { 'MAKEPKG_NOT_DISCOVERED' } elseif ($observed.Count -gt 1) { 'MAKEPKG_MULTIPLE_CANDIDATES_UNAPPROVED' } elseif (-not $sha) { 'MAKEPKG_LINKED_CANDIDATE_UNTRUSTED' } else { 'MAKEPKG_CANDIDATE_DISCOVERED_UNAPPROVED' }
          $result = [ordered]@{
            schema_version = 2
            status = $status
            product = 'Signal Sprint'
            partner_center_selection = 'GDK_GAME'
            request_id = 'game-signal-sprint-c058cbf7fe38e02d929c67d047d717ff74bd522e'
            immutable_source_sha = 'c058cbf7fe38e02d929c67d047d717ff74bd522e'
            runner_os = $env:RUNNER_OS
            runner_image = $env:ImageOS
            runner_image_version = $env:ImageVersion
            makepkg_on_path = [bool]($pathMatches.Count -gt 0)
            makepkg_candidates = $observed
            makepkg_sha256_observed_unapproved = $sha
            gdk_environment_hints = $hints
            makepkg_executed = $false
            sdk_version_verified = $false
            cas_return_pass = $false
            real_msix_pass = $false
            e2e_pass = $false
            store_submitted = $false
          }
          $result | ConvertTo-Json -Depth 6 |
            Set-Content -LiteralPath gdk-sdk-environment-probe.json -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '## Signal Sprint — GDK SDK hosted runner probe'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Status: $status"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'A discovered hash is observational, NOT approved SDK provenance. No makepkg execution or package was produced.'
      - name: Preserve machine-readable environment evidence
        uses: actions/upload-artifact@v4
        with:
          name: signal-sprint-gdk-sdk-environment-probe
          path: gdk-sdk-environment-probe.json
          if-no-files-found: error
          retention-days: 7
